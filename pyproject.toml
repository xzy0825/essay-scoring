[project]
name = "essay-scoring"
version = "0.1.0"
description = "Automated essay scoring baseline and DeBERTa model for interview delivery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "protobuf>=7.36.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.2",
    "torch>=2.5.1",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
